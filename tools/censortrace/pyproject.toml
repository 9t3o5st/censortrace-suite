[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "censortrace"
version = "2.0.0"
description = "Asynchronous, plugin-based Internet censorship measurement toolkit (Iran NIN heuristics, ECH/QUIC/ODoH/DoQ probes, tunnel fingerprinting)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CensorTrace Suite Maintainers" }]
keywords = [
  "censorship-measurement", "dpi", "iran", "network-security",
  "quic", "ech", "ooni", "internet-freedom",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]

# Core runtime is deliberately tiny: every probe works with stdlib only.
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
odoh = ["cryptography>=42.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "build",
  "PyYAML>=6.0",
  "types-PyYAML",
]

[project.scripts]
censortrace = "censortrace.cli:main"

[project.urls]
Homepage = "https://github.com/9t3o5st/censortrace-suite"
Repository = "https://github.com/9t3o5st/censortrace-suite"
Changelog = "https://github.com/9t3o5st/censortrace-suite/blob/main/CHANGELOG.md"
Documentation = "https://github.com/9t3o5st/censortrace-suite/tree/main/docs"

[tool.setuptools.packages.find]
include = ["censortrace*"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["censortrace.py"]  # frozen v1 legacy script kept verbatim

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["censortrace"]
ignore_missing_imports = true
# v2 was refactored without a type-gate; strict mode is an explicit roadmap
# item (see CONTRIBUTING.md). Start permissive so CI is green and ratchets up.
warn_unused_ignores = false
follow_imports = "silent"
