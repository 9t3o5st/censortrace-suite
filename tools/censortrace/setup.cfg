# Metadata lives in pyproject.toml (single source of truth: version 2.0.0).
# This file only carries flake8-style line limits for editors/tooling that
# still read setup.cfg, and declares the sdist/wheel content.
[metadata]
name = censortrace
version = attr: censortrace.__version__

[flake8]
max-line-length = 100
extend-ignore = E501

[sdist]
formats = gztar

[bdist_wheel]
py3-none-any = true
